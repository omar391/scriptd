[package]
name = "scriptd-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal signed companion bridge for Scriptd desktop applications."

[dependencies]
anyhow = "1.0"
hex = "0.4"
libc = "0.2"
quick-xml = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
scriptd-bridge-protocol = { path = "../scriptd-bridge-protocol" }

[dev-dependencies]
tempfile = "3.10"
