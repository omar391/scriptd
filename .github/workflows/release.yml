name: Signed bridge release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Enforce the public bridge source boundary
        run: ./tools/check-bridge-source-boundary.sh
      - name: Test public source-boundary coverage
        run: ./tools/test-bridge-source-boundary.sh
      - name: Validate installer lifecycle scripts
        run: ./tools/test-bridge-installer.sh
      - name: Test the bridge and shared protocol
        run: cargo +stable test --locked --workspace
      - name: Build the bridge
        run: cargo +stable build --locked --release -p scriptd-bridge
      - name: Import Developer ID signing identities
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/scriptd-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-cert.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Sign and package the bridge daemon
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
        run: |
          set -euo pipefail
          test -n "$DEVELOPER_ID_APPLICATION"
          test -n "$DEVELOPER_ID_INSTALLER"
          BIN=target/release/scriptd-bridge
          codesign --force --options runtime --timestamp --identifier com.astronlab.scriptd.bridge --sign "$DEVELOPER_ID_APPLICATION" "$BIN"
          codesign --verify --deep --strict "$BIN"
          PKGROOT="$RUNNER_TEMP/scriptd-pkgroot"
          mkdir -p "$PKGROOT/usr/local/libexec" "$PKGROOT/Library/LaunchDaemons"
          install -m 755 "$BIN" "$PKGROOT/usr/local/libexec/scriptd-bridge"
          install -m 644 tools/bridge/com.astronlab.scriptd.bridge.plist "$PKGROOT/Library/LaunchDaemons/com.astronlab.scriptd.bridge.plist"
          VERSION="${GITHUB_REF_NAME#v}"
          pkgbuild --root "$PKGROOT" --scripts tools/bridge/pkg-scripts --identifier com.astronlab.scriptd.bridge.pkg --version "$VERSION" --install-location / --ownership recommended --sign "$DEVELOPER_ID_INSTALLER" "$RUNNER_TEMP/ScriptdBridge.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/ScriptdBridge.pkg"
      - name: Notarize and staple the package
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_NOTARY_KEY_BASE64"
          test -n "$APPLE_NOTARY_KEY_ID"
          test -n "$APPLE_NOTARY_ISSUER_ID"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"
          xcrun notarytool submit "$RUNNER_TEMP/ScriptdBridge.pkg" --key "$NOTARY_KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$RUNNER_TEMP/ScriptdBridge.pkg"
          xcrun stapler validate "$RUNNER_TEMP/ScriptdBridge.pkg"
          spctl --assess --type install --verbose "$RUNNER_TEMP/ScriptdBridge.pkg"
      - name: Create checksums and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/ScriptdBridge.pkg" ScriptdBridge.pkg
          shasum -a 256 ScriptdBridge.pkg > SHA256SUMS
          pkgutil --check-signature ScriptdBridge.pkg
          gh release create "$GITHUB_REF_NAME" ScriptdBridge.pkg SHA256SUMS --verify-tag --generate-notes --title "Scriptd Bridge ${GITHUB_REF_NAME}"
