name: macOS isolated verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Public repositories receive standard GitHub-hosted macOS VMs at no charge.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run isolated macOS tests serially
        run: cargo +stable test --locked -- --test-threads=1
      - name: Verify a live replacement in the isolated GUI launchd domain
        run: cargo +stable test --locked control::tests::live_replacement_user_domain_service_cannot_authenticate -- --ignored --exact --test-threads=1
