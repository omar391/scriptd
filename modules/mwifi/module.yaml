# yaml-language-server: $schema=../../schemas/v1/modules/mwifi.schema.json
version: 1

module:
  id: mwifi
  display_name: Wi-Fi Monitor
  mode: task

settings:
  min_dwell: 180
  ping_target: 1.1.1.1
  ping_count: 3
  ping_timeout: 1
  ping_high_latency_ms: 250
  health_failure_switch_runs: 2
  band_bonus_2g: 0
  band_bonus_5g: 35
  band_bonus_6g: 50
  preference_top_bonus: 30
  preference_rank_decay: 5
  current_sticky_bonus: 25
  rssi_offset: 100
  min_switch_score_delta: 10
  prefer_ssids:
    - knight_riders_5G
  ssids: []
  repeater_rules:
    - pattern: 'knight_riders\b.*'
      parent_ssid: knight_riders_5G
