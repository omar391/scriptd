# yaml-language-server: $schema=./schemas/v1/service.schema.json
version: 1

service:
  label: com.omar.scriptd
  log_dir: ~/Library/Logs/scriptd
  watch: true
  self_update_check_hours: 12

modules:
  mbrew:
    enabled: true
    triggers:
      maintenance:
        fire:
          mode: every_match
        when:
          schedule:
            daily_at: "00:00"
            timezone: Asia/Dhaka

  mcpu:
    enabled: false
    triggers:
      sample:
        fire:
          mode: every_match
        when:
          schedule:
            every_minutes: 1

  mwifi:
    enabled: true
    triggers:
      sample:
        fire:
          mode: every_match
        when:
          schedule:
            every_minutes: 5

  miwatch:
    enabled: true
    triggers:
      outage:
        fire:
          mode: latched
          after:
            consecutive_matches: 3
            minimum_seconds: 60
          reset:
            after:
              consecutive_matches: 2
              minimum_seconds: 30
            when:
              wifi_ssid:
                ssid: knight_riders_5G
                state: available
        when:
          all:
            - schedule:
                every_seconds: 30
            - wifi_ssid:
                ssid: knight_riders_5G
                state: unavailable
            - any:
                - time_window:
                    timezone: Asia/Dhaka
                    start: "05:00"
                    end: "02:00"
                - process_network:
                    applications: [Codex]
                    aggregation: sum
                    at_least_bytes_per_second: 1024
